name: Site validation
on:
  push:
    branches: [main]
  pull_request:
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Validate static pages and assets
        run: |
          python3 scripts/check_site.py
          python3 scripts/check_seo.py
