<svg xmlns="http://www.w3.org/2000/svg" width="1536" height="1024" viewBox="0 0 1536 1024" role="img" aria-labelledby="title desc"><title id="title">Net-mounted MatchPoint LED scoreboard concept</title><desc id="desc">Concept illustration of a green and blue LED score panel strapped to a tennis net, alongside a connected live-scoring mobile phone.</desc><defs><linearGradient id="sky" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#152d40"/><stop offset=".5" stop-color="#7e8e88"/><stop offset="1" stop-color="#dd9a68"/></linearGradient><linearGradient id="court" x1="0" x2="0" y1="0" y2="1"><stop stop-color="#486c61"/><stop offset="1" stop-color="#112b2b"/></linearGradient><pattern id="net" width="31" height="31" patternUnits="userSpaceOnUse"><path d="M0 0H31V31" stroke="#081319" stroke-width="4" fill="none" opacity=".95"/></pattern><filter id="shadow"><feGaussianBlur in="SourceAlpha" stdDeviation="14"/><feOffset dy="9"/><feComponentTransfer><feFuncA type="linear" slope=".55"/></feComponentTransfer><feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge></filter><filter id="glow"><feGaussianBlur stdDeviation="5" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter></defs><rect x="0" y="0" width="1536" height="1024" rx="0" fill="url(#sky)" /><circle cx="1270" cy="201" r="140" fill="#ffe2a7" opacity=".56"/><path d="M0 462L240 383 490 429 752 347 1002 405 1260 347 1536 429V1024H0" fill="#30474b" opacity=".9"/><rect x="0" y="612" width="1536" height="412" rx="0" fill="url(#court)" /><path d="M0 780H1536M0 961H1536M772 610V1024M148 1024L424 612M1390 1024L1109 612" fill="none" stroke="#e4ece0" stroke-width="7" opacity=".55"/><rect x="0" y="347" width="1536" height="462" rx="0" fill="url(#net)" /><rect x="0" y="341" width="1536" height="25" rx="0" fill="#dcdcd3" /><rect x="0" y="0" width="1536" height="116" rx="0" fill="#071926" opacity=".7"/><text x="79" y="75" fill="#f4f9f2" font-size="38" font-family="Arial,Helvetica,sans-s